<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Stanford Swim Clocks</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #0d0505;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  min-height: 100vh;
}

/* ═══ VIEWS ═══ */
#setupView, #clockView { display: none; }
#setupView.active { display: flex; flex-direction: column; }
#clockView.active  { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

/* ═══ SETUP ═══ */
#setupView {
  padding: 20px 16px 40px;
  gap: 14px;
  max-width: 860px;
  margin: 0 auto;
  width: 100%;
}

.setup-hdr { text-align: center; padding: 8px 0; }
.setup-hdr h1 {
  font-size: 1.5rem; font-weight: 900;
  letter-spacing: 0.1em; text-transform: uppercase; color: #c0392b;
}
.setup-hdr .sub { font-size: 0.75rem; color: #7a3030; margin-top: 4px; }

.card {
  background: #1b0b0b;
  border-radius: 12px;
  border: 1px solid #2e1010;
  overflow: hidden;
}
.card-lbl {
  display: block; padding: 11px 14px 5px;
  font-size: 0.68rem; font-weight: 700;
  color: #c0392b; letter-spacing: 0.1em; text-transform: uppercase;
}
.card-body { padding: 0 14px 14px; }

textarea#setInput {
  width: 100%; min-height: 240px;
  background: transparent; border: none; outline: none;
  color: #ccd; font-family: 'SF Mono', 'Courier New', monospace;
  font-size: 0.82rem; line-height: 1.65; resize: vertical; padding: 4px 0 0;
}
textarea#setInput::placeholder { color: #5a2020; }

.tier-row {
  display: flex; align-items: center; gap: 10px; margin-bottom: 8px;
}
.tier-row:last-child { margin-bottom: 0; }
.tdot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }
.tdot.t1 { background: #2ecc71; }
.tdot.t2 { background: #3498db; }
.tdot.t3 { background: #e74c3c; }
.tier-row input {
  flex: 1; min-width: 0;
  background: #110606; border: 1px solid #2e1010; border-radius: 6px;
  padding: 7px 10px; color: #ccd; font-size: 0.78rem; outline: none;
}
.tier-row input:focus { border-color: #c0392b; }
.tier-row label { font-size: 0.68rem; color: #c0392b; white-space: nowrap; width: 100px; flex-shrink: 0; }
.tier-row .css-inp {
  width: 70px; flex: none;
  text-align: center; font-family: 'SF Mono', monospace;
}
.css-unit { font-size: 0.65rem; color: #5a2020; flex-shrink: 0; }

/* Tier count toggle */
.tc-btns { display: flex; gap: 6px; }
.tc-btn {
  width: 36px; height: 30px;
  background: #110606; border: 1px solid #2e1010;
  border-radius: 6px; color: #7a3030; font-size: 0.85rem;
  font-weight: 700; cursor: pointer; transition: all .15s;
}
.tc-btn.active { background: #8C1515; border-color: #c0392b; color: #fff; }

/* Range edit popup */
#rangePopup {
  display: none; position: fixed;
  background: #1b0b0b; border: 1px solid #3a1515;
  border-radius: 10px; padding: 14px 16px;
  z-index: 9999; box-shadow: 0 8px 32px rgba(0,0,0,.8);
  min-width: 200px;
}
#rangePopup.open { display: block; }
#rangePopup h4 {
  font-size: 0.65rem; font-weight: 700; color: #c0392b;
  text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 10px;
}
.rp-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.rp-row label { font-size: 0.65rem; color: #a06060; width: 28px; flex-shrink: 0; }
.rp-inp {
  width: 70px; background: #110606; border: 1px solid #2e1010;
  border-radius: 5px; padding: 5px 8px; color: #ccd;
  font-family: 'SF Mono', monospace; font-size: 0.82rem; outline: none;
  text-align: center;
}
.rp-inp:focus { border-color: #c0392b; }
.rp-btns { display: flex; gap: 6px; margin-top: 10px; }
.rp-save { flex: 1; padding: 6px; background: #8C1515; color: #fff; border: none; border-radius: 6px; font-weight: 700; font-size: 0.8rem; cursor: pointer; }
.rp-cancel { padding: 6px 10px; background: #180a0a; color: #a06060; border: 1px solid #2e1010; border-radius: 6px; font-size: 0.8rem; cursor: pointer; }
.rp-reset { padding: 6px 10px; background: #180a0a; color: #8b3030; border: 1px solid #2a1212; border-radius: 6px; font-size: 0.75rem; cursor: pointer; }
.edit-range-btn {
  background: none; border: none; cursor: pointer;
  color: #6a2020; font-size: 0.7rem; padding: 0 4px;
  vertical-align: middle; line-height: 1;
  transition: color .15s;
}
.edit-range-btn:hover { color: #c0392b; }

.launch-btn {
  align-self: center;
  padding: 14px 48px; background: #8C1515; color: #fff;
  border: none; border-radius: 10px; font-size: 1.05rem;
  font-weight: 800; letter-spacing: 0.06em; cursor: pointer;
  text-transform: uppercase; transition: filter .15s, transform .1s;
}
.launch-btn:hover { filter: brightness(1.18); }
.launch-btn:active { transform: scale(0.96); }

.example-link {
  text-align: center; font-size: 0.7rem; color: #5a2020; cursor: pointer; margin-top: -4px;
}
.example-link:hover { color: #c0392b; }

/* AI Clean button */
.ai-bar { display: flex; gap: 8px; align-items: center; padding: 8px 14px 10px; }
.ai-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 7px 14px; background: #1a1040; border: 1px solid #3a2080;
  border-radius: 7px; color: #b8a0ff; font-size: 0.75rem; font-weight: 700;
  cursor: pointer; transition: all .15s; letter-spacing: 0.03em;
}
.ai-btn:hover { background: #2a1860; border-color: #6a40d0; color: #d4c0ff; }
.ai-btn:active { transform: scale(0.96); }
.ai-btn:disabled { opacity: 0.4; cursor: default; }
.ai-btn .ai-icon { font-size: 0.9rem; }
.ai-btn .ai-spin { display: inline-block; animation: spin 1s linear infinite; }
@keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
.ai-status { font-size: 0.65rem; color: #6a40a0; flex: 1; }

/* Preview */
.prev-sec {
  margin-bottom: 12px; padding: 10px; border-radius: 8px;
  background: #110606; border: 1px solid #2e1010;
}
.prev-sec:last-child { margin-bottom: 0; }
.prev-sec-title {
  font-size: 0.85rem; font-weight: 800; color: #c0392b;
  margin-bottom: 6px;
}
.prev-sec-meta {
  font-size: 0.68rem; color: #8a5050; margin-bottom: 6px;
  line-height: 1.6;
}
.prev-sec-meta span {
  display: inline-block; background: #1a0808; padding: 1px 6px;
  border-radius: 3px; margin-right: 4px; margin-bottom: 2px;
}
.prev-rep {
  display: flex; align-items: center; gap: 8px;
  padding: 3px 8px; border-radius: 4px;
  margin-bottom: 2px; font-size: 0.78rem;
}
.prev-rep:nth-child(odd) { background: rgba(255,255,255,0.02); }
.prev-rep .pr-idx { color: #5a2020; width: 22px; text-align: right; font-size: 0.65rem; }
.prev-rep .pr-dist { color: #fff; font-weight: 800; min-width: 50px; }
.prev-rep .pr-laps { color: #e8b830; font-size: 0.7rem; font-weight: 600; }
.prev-rep .pr-laps-inline { color: #fff; opacity: 0.55; font-size: 0.7rem; font-weight: 600; margin-left: 2px; }
.prev-rep .pr-target { color: #2ecc71; font-family: 'SF Mono', monospace; font-size: 0.7rem; }
.prev-rep .pr-rnd { color: #8a5050; font-size: 0.6rem; font-style: italic; }
.prev-rep .pr-zone, .prev-rep .pr-rest {
  display: inline-block; padding: 2px 6px; border-radius: 3px;
  font-size: 0.65rem; font-weight: 700; margin-left: 4px; vertical-align: middle;
  letter-spacing: 0.03em;
}
.prev-rep .pr-zone { background: #2a4060; color: #a8c4e8; }
.prev-rep .pr-rest { background: #3a2810; color: #e8b830; }
.sr-zone, .sr-rest {
  display: inline-block; padding: 3px 8px; border-radius: 4px;
  font-size: 0.8rem; font-weight: 700; vertical-align: middle;
  letter-spacing: 0.04em; white-space: nowrap;
}
.sr-zone { background: #2a4060; color: #a8c4e8; }
.sr-rest { background: #3a2810; color: #e8b830; }
/* Zone-specific colors — intensity at a glance */
.sr-zone.z-z1, .prev-rep .pr-zone.z-z1 { background: #1a3a2a; color: #8ae0b0; }
.sr-zone.z-z2, .prev-rep .pr-zone.z-z2 { background: #1a3050; color: #a8c4e8; }
.sr-zone.z-z3, .prev-rep .pr-zone.z-z3 { background: #4a3810; color: #f0c860; }
.sr-zone.z-z4, .prev-rep .pr-zone.z-z4 { background: #4a1820; color: #f08090; }
.sr-zone.z-z5, .prev-rep .pr-zone.z-z5 { background: #4a1050; color: #e080f0; }
.prev-item { font-size: 0.78rem; color: #d4b0b0; padding: 2px 8px; }
.prev-warn {
  font-size: 0.72rem; color: #e8a020; padding: 6px 8px;
  background: #2a1800; border-radius: 4px; margin-top: 6px;
}
.prev-ok {
  font-size: 0.72rem; color: #2ecc71; padding: 6px 8px;
  background: #0a1a0d; border-radius: 4px; margin-top: 6px;
}

/* ═══ CLOCK VIEW ═══ */

/* Tab bar */
.top-bar {
  display: flex; align-items: stretch; flex-shrink: 0;
  background: #0d0404; border-bottom: 2px solid #1a0808;
}
.sec-tab {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 7px 4px; cursor: pointer;
  border-right: 1px solid #1a0808;
  user-select: none; transition: background .2s;
  min-width: 0;
}
.sec-tab:last-child { border-right: none; }
.sec-tab .tt { font-size: 0.65rem; font-weight: 700; color: #9a4040; text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.sec-tab .ts { font-size: 0.5rem; color: #7a3030; font-weight: 600; margin-top: 1px; }
.sec-tab.s-active { background: #1a0a0a; border-bottom: 3px solid #8C1515; }
.sec-tab.s-active .tt { color: #fff; }
.sec-tab.s-active .ts { color: #c0392b; }
.sec-tab.s-done { background: #0d0404; }
.sec-tab.s-done .tt { color: #2a7a48; text-decoration: line-through; }
.sec-tab.s-done .ts { color: #2ecc71; }

/* Hero: current set overview */
.hero {
  flex-shrink: 0;
  background: #180a0a;
  border-bottom: 2px solid #2e1010;
  padding: 10px 16px;
  overflow-x: auto;
  white-space: nowrap;
}
.hero-title {
  font-size: 1.15rem; font-weight: 900;
  letter-spacing: 0.04em; color: #fff; margin-bottom: 4px;
  display: inline-block;
}
.hero-sub { font-size: 0.75rem; color: #c0392b; margin-left: 8px; }
.hero-items { margin-top: 6px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.hi { font-size: 1.1rem; padding: 4px 10px; border-radius: 5px; color: #d4b0b0; display: inline-block; transition: all .2s; }
.hi.done  { color: #3a9060; text-decoration: line-through; font-size: 0.95rem; }
.hi.cur   { color: #fff; background: rgba(25,111,61,0.4); border: 1px solid rgba(46,204,113,0.6); font-weight: 800; font-size: 1.35rem; }
.hi.plain { color: #c08080; }
.hero-rest { font-size: 0.85rem; color: #e8b830; margin-left: 6px; font-weight: 600; }
.hero-eq   { font-size: 0.8rem; color: #a06060; margin-left: 4px; font-style: italic; }
.hero-items-wrap { font-size: 1.1rem; color: #d4b0b0; line-height: 2.1; white-space: pre-wrap; }

/* Vertical set list for ready/break states */
.set-list { display: flex; flex-direction: column; gap: 6px; align-items: stretch; width: 100%; padding: 0 10px; }
.set-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border-radius: 8px; width: 100%;
  background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05);
  transition: all .2s;
  flex-wrap: wrap; /* let the target range wrap to a 2nd line if it has to */
}
.set-row.sr-cur {
  background: rgba(25,111,61,0.35); border: 1px solid rgba(46,204,113,0.5);
  transform: scale(1.04);
}
.set-row.sr-done { opacity: 0.4; text-decoration: line-through; }
.sr-num { font-size: 1.6rem; color: #fff; font-weight: 800; min-width: 44px; text-align: right; flex-shrink: 0; padding-right: 4px; }
.sr-dist { font-size: 1.8rem; font-weight: 800; color: #fff; flex-shrink: 0; white-space: nowrap; }
.sr-dist .sr-laps { font-size: 1.1rem; color: #fff; font-weight: 600; opacity: 0.55; margin-left: 4px; }
.sr-meta { display: flex; flex-direction: row; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-start; padding-left: 4px; }
/* Target range pushes to right, gets own line on narrow columns */
.sr-target {
  font-family: 'SF Mono',monospace; font-size: 1.05rem; color: #2ecc71; font-weight: 700;
  white-space: nowrap; margin-left: auto; flex-shrink: 0;
}

/* Clocks area */
.clocks-area {
  flex: 1; display: flex; flex-direction: row; overflow: hidden; min-height: 0;
}
.clock-col {
  flex: 1; display: flex; flex-direction: column;
  border-right: 1px solid #1a0808; overflow: hidden; min-width: 0;
}
.clock-col:last-child { border-right: none; }

.tier-hdr { padding: 10px 8px 8px; text-align: center; flex-shrink: 0; }
.tier-name { font-size: 1.1rem; font-weight: 800; letter-spacing: 0.03em; }
.tier-names { font-size: 0.65rem; color: rgba(255,255,255,0.65); margin-top: 3px; line-height: 1.4; }
.t1 .tier-hdr { background: #163d28; }
.t2 .tier-hdr { background: #112850; }
.t3 .tier-hdr { background: #3a0f0f; }

.cbody {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 8px 6px; gap: 4px;
  transition: background .35s; min-height: 0; overflow: hidden;
}

/* clock states */
.cbody.st   { background: #0d0505; }
.cbody.rd   { background: #0d0505; }
.cbody.sw0  { background: #120808; }
.cbody.swg  { background: #041a0a; }
.cbody.swr  { background: #1a0404; }
.cbody.rs   { background: #0d0505; }
.cbody.brk  { background: #141000; }
.cbody.dn   { background: #0a0404; }
.cbody.pd   { background: #0d0505; }

.standby-msg {
  font-size: 1.3rem; font-weight: 800;
  color: #6a2020; letter-spacing: 0.12em; text-transform: uppercase;
  text-align: center; line-height: 1.6;
}
.standby-msg span { display: block; font-size: 0.65rem; color: #7a3030; font-weight: 400; margin-top: 3px; letter-spacing: 0.05em; }

.c-rep-lbl { font-size: 0.55rem; color: #a06060; text-transform: uppercase; letter-spacing: 0.1em; }
.c-rep-num { color: #c0392b; font-weight: 700; }

.c-dist {
  font-size: 2.4rem; font-weight: 900; color: #fff;
  line-height: 1; text-align: center; letter-spacing: -0.02em;
}
.c-zone { font-size: 0.58rem; color: #a06060; text-align: center; }
.c-zone-badge {
  display: inline-block; padding: 4px 12px; border-radius: 5px;
  font-size: 0.95rem; font-weight: 800; letter-spacing: 0.05em;
  margin: 2px auto 4px; text-align: center;
}
.c-zone-badge.z-z1 { background: #1a3a2a; color: #8ae0b0; }
.c-zone-badge.z-z2 { background: #1a3050; color: #a8c4e8; }
.c-zone-badge.z-z3 { background: #4a3810; color: #f0c860; }
.c-zone-badge.z-z4 { background: #4a1820; color: #f08090; }
.c-zone-badge.z-z5 { background: #4a1050; color: #e080f0; }
.c-zone-wrap { text-align: center; }

.c-time {
  font-family: 'SF Mono', 'Courier New', monospace;
  font-size: 5.5rem; font-weight: 700;
  letter-spacing: -0.02em; line-height: 1;
  color: #aabbcc; font-variant-numeric: tabular-nums;
}
.c-time.tg { color: #2ecc71; }
.c-time.tr { color: #e74c3c; }
.c-time.tb { color: #c0392b; }
.c-time.ty { color: #e8c000; }
.c-time.tw { color: #ccd; }

.c-badge {
  font-size: 0.6rem; font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase; padding: 3px 10px; border-radius: 20px;
  background: rgba(255,255,255,0.08); color: #c08080;
}
.c-badge.bg { background: #196f3d; color: #fff; }
.c-badge.br { background: #8b1212; color: #faa; }
.c-badge.bb { background: #3a0a0a; color: #c0392b; }
.c-badge.by { background: #2c2000; color: #e8c000; }


.c-target {
  font-family: 'SF Mono', monospace;
  font-size: 0.65rem; color: #8a3030; text-align: center;
}
.c-target b { color: #2ecc71; font-size: 1.6rem; font-weight: 800; letter-spacing: -0.01em; display: block; line-height: 1.1; margin-top: 1px; }
.c-target b.red { color: #e74c3c; font-size: 1.6rem; font-weight: 800; letter-spacing: -0.01em; display: block; line-height: 1.1; }

.c-dots { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; max-width: 90%; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: #2a0a0a; }
.dot.dd { background: #196f3d; }
.dot.dc { background: #fff; box-shadow: 0 0 5px rgba(255,255,255,.5); }
.dot.dm { background: #8b1212; }

.c-laps { font-size: 1rem; font-weight: 800; color: #e8b830; text-align: center; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 2px; }
.c-next { font-size: 0.62rem; color: #8a3030; text-align: center; }
.c-next b { color: #ccd; }
.c-next-lbl { font-size: 0.5rem; color: #8a3030; text-transform: uppercase; letter-spacing: 0.14em; text-align: center; margin-top: 4px; }
.c-next-dist { font-size: 2rem; font-weight: 900; color: #fff; line-height: 1; text-align: center; letter-spacing: -0.02em; }
.c-next-target { font-family: 'SF Mono', monospace; font-size: 0.72rem; color: #8a3030; text-align: center; margin-top: 1px; }
.c-next-target b { color: #2ecc71; font-weight: 700; }

.go-banner {
  font-size: 1.3rem; font-weight: 900; color: #2ecc71;
  letter-spacing: 0.1em; text-transform: uppercase;
  animation: pulse .75s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

/* Bottom controls */
.bottom-bar {
  display: flex; align-items: center; justify-content: center;
  gap: 8px; padding: 8px 12px; flex-shrink: 0;
  background: #0a0404; border-top: 2px solid #1a0808;
}
.btn {
  padding: 9px 20px; border: none; border-radius: 8px;
  font-size: 0.85rem; font-weight: 700; cursor: pointer;
  letter-spacing: 0.04em; transition: transform .1s, filter .15s;
  white-space: nowrap;
}
.btn:hover { filter: brightness(1.12); }
.btn:active { transform: scale(0.95); }
.btn:disabled { opacity: 0.3; cursor: default; }
.btn-green  { background: #196f3d; color: #fff; }
.btn-orange { background: #b36200; color: #fff; }
.btn-red    { background: #8b1212; color: #fff; }
.btn-blue   { background: #134070; color: #9cc; }
.btn-gray   { background: #180a0a; color: #7a3030; border: 1px solid #2e1010; }
.btn-yellow { background: #3a2c00; color: #e8c000; border: 1px solid #5a4400; }

.back-link {
  font-size: 0.6rem; color: #8a3030; cursor: pointer; padding: 4px 8px;
}
.back-link:hover { color: #c0392b; }

/* paused overlay badge */
.paused-tag {
  font-size: 0.7rem; font-weight: 700; letter-spacing: 0.12em;
  text-transform: uppercase; color: #b36200;
  padding: 2px 8px; border: 1px solid #3a2600; border-radius: 4px;
}

/* Per-tier controls */
.tier-btns {
  display: flex; gap: 5px; justify-content: center; align-items: center;
  padding: 4px 8px; flex-shrink: 0;
  border-bottom: 1px solid #1a0808;
  min-height: 28px;
}
.tier-btn {
  padding: 3px 10px; border: none; border-radius: 4px;
  font-size: 0.62rem; font-weight: 700; cursor: pointer;
  letter-spacing: 0.05em; transition: filter .12s;
  white-space: nowrap;
}
.tier-btn:hover { filter: brightness(1.2); }
.tier-btn.tb-pause  { background: #3a1200; color: #e8b830; border: 1px solid #5a2800; }
.tier-btn.tb-resume { background: #196f3d; color: #fff; }
.tier-btn.tb-reset  { background: #180a0a; color: #8a3030; border: 1px solid #2e1010; }

/* section-advancing flash */
@keyframes sectionFlash { 0%{opacity:1} 50%{opacity:.5} 100%{opacity:1} }
.section-flash { animation: sectionFlash .4s ease 2; }
</style>
</head>
<body>

<!-- ═══ SETUP VIEW ═══ -->
<div id="setupView" class="active">
  <div class="setup-hdr">
    <h1>Stanford Swim</h1>

<script>
'use strict';

// ── Audio ────────────────────────────────────────────────────────────────────
var _audioCtx = null;
function getAudio() {
  try {
    if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (_audioCtx.state === 'suspended') _audioCtx.resume();
    return _audioCtx;
  } catch(e) { return null; }
}
function _whistleBlast(startT, dur, ctx) {
  // Filtered noise + sine = realistic pea whistle timbre
  var bufLen = Math.ceil(ctx.sampleRate * (dur + 0.15));
  var noiseBuf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
  var nd = noiseBuf.getChannelData(0);
  for (var i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;

  var noise = ctx.createBufferSource();
  noise.buffer = noiseBuf;

  // Narrow bandpass around whistle freq — gives "hissy air" quality
  var bpf = ctx.createBiquadFilter();
  bpf.type = 'bandpass';
  bpf.frequency.value = 2450;
  bpf.Q.value = 22;

  // Sine tone underneath for pitch clarity
  var osc = ctx.createOscillator();
  osc.type = 'sine';
  osc.frequency.value = 2450;

  // Pea flutter: ~28 Hz tremolo
  var lfo = ctx.createOscillator();
  lfo.type = 'sine';
  lfo.frequency.value = 28;
  var lfoDepth = ctx.createGain();
  lfoDepth.gain.value = 0.12;

  var noiseGain = ctx.createGain();
  noiseGain.gain.value = 0.55;
  var oscGain = ctx.createGain();
  oscGain.gain.value = 0.38;
  var env = ctx.createGain();

  noise.connect(bpf); bpf.connect(noiseGain); noiseGain.connect(env);
  osc.connect(oscGain); oscGain.connect(env);
  env.connect(ctx.destination);
  lfo.connect(lfoDepth); lfoDepth.connect(env.gain);

  var end = startT + dur;
  env.gain.setValueAtTime(0, startT);
  env.gain.linearRampToValueAtTime(0.75, startT + 0.022);
  env.gain.setValueAtTime(0.75, end - 0.07);
  env.gain.linearRampToValueAtTime(0, end + 0.02);

  lfo.start(startT);   lfo.stop(end + 0.05);
  osc.start(startT);   osc.stop(end + 0.05);
  noise.start(startT); noise.stop(end + 0.05);
}
// Per-tier GO whistle: ti=0 short, ti=1 medium, ti=2 long
var _GO_DURS = [0.30, 0.60, 0.95];
function beepGo(ti) {
  var ctx = getAudio(); if (!ctx) return;
  var dur = (ti !== undefined) ? _GO_DURS[ti] : 0.60;

}
// Two short blasts for section transition
function beepSection() {
  var ctx = getAudio(); if (!ctx) return;

  _whistleBlast(t,        0.42, ctx);

}

    z4:{ 25:[14,15], 36:[21,22], 50:[30,31], 72:[47,49], 75:[49,51], 100:[66,68], 108:[72,75], 144:[98,101], 150:[102,105], 180:[123,127], 200:[137,141], 216:[150,154], 250:[175,180], 252:[177,182], 288:[204,210], 300:[213,219], 324:[232,239], 360:[261,268], 400:[290,299], 432:[318,327], 500:[398,410], 540:[399,411] },
    z5:{ 25:[13,14], 36:[20,20], 50:[27,29], 72:[43,45], 75:[45,47], 100:[61,63], 108:[67,69], 144:[90,93], 150:[94,97], 180:[114,117], 200:[126,130], 216:[138,142], 250:[161,166], 252:[163,168], 288:[188,194], 300:[196,202], 324:[213,220], 360:[239,246], 400:[266,274], 432:[292,301], 500:[366,377], 540:[367,378] },
  },
};
var TKEYS = ['tier1','tier2','tier3'];
var TIER_COUNT = 3; // how many columns to show

var _TIER_PRESETS = {
  3: [
    'Ohl* \xb7 Krilanovich \xb7 West \xb7 Oerlemans \xb7 De Vecchis \xb7 Mathiopoulos',

// ── Range popup ──────────────────────────────────────────────────────────────
var _rpState = null; // {ti, zKey, dist}

function openRangePopup(ti, zKey, dist, anchorEl) {
  _rpState = {ti:ti, zKey:zKey, dist:dist};
  var pace = getPace(ti, zKey, dist);
  document.getElementById('rpLo').value = fmtS(pace[0]);
  document.getElementById('rpHi').value = fmtS(pace[1]);
  var popup = document.getElementById('rangePopup');
  popup.classList.add('open');
  // Position near anchor or center of screen
  var rect = anchorEl ? anchorEl.getBoundingClientRect() : null;
  if (rect) {
    popup.style.top  = Math.min(rect.bottom + 8, window.innerHeight - 160) + 'px';
    popup.style.left = Math.max(8, Math.min(rect.left, window.innerWidth - 220)) + 'px';
  } else {
    popup.style.top  = '50%'; popup.style.left = '50%';
    popup.style.transform = 'translate(-50%,-50%)';
  }
}

function parseTimeInput(val) {
  val = val.trim();
  var m = val.match(/^(\d+):(\d{2})$/);
  if (m) return parseInt(m[1])*60 + parseInt(m[2]);
  m = val.match(/^(\d+)\.(\d+)$/);
  if (m) return parseFloat(val);
  return parseFloat(val) || null;
}

function saveRange() {
  if (!_rpState) return;
  var lo = parseTimeInput(document.getElementById('rpLo').value);
  var hi = parseTimeInput(document.getElementById('rpHi').value);
  if (!lo || !hi || lo >= hi) { alert('Invalid times — enter as M:SS (e.g. 1:11)'); return; }
  var key = _rpState.ti + ':' + _rpState.zKey + ':' + _rpState.dist;
  rangeOverrides[key] = [lo, hi];
  closeRangePopup();
  renderClocks();
}

function resetRange() {
  if (!_rpState) return;
  var key = _rpState.ti + ':' + _rpState.zKey + ':' + _rpState.dist;
  delete rangeOverrides[key];
  // Refresh inputs to show default
  var pace = getPace(_rpState.ti, _rpState.zKey, _rpState.dist);
  document.getElementById('rpLo').value = fmtS(pace[0]);
  document.getElementById('rpHi').value = fmtS(pace[1]);
}

function closeRangePopup() {
  document.getElementById('rangePopup').classList.remove('open');
  _rpState = null;
}

// Close popup when clicking outside
document.addEventListener('click', function(e){
  var popup = document.getElementById('rangePopup');
  if (popup.classList.contains('open') && !popup.contains(e.target) && !e.target.classList.contains('edit-range-btn')) {
    closeRangePopup();
  }
});

function getPace(ti, zKey, dist) {
  // Check manual overrides first
  var oKey = ti + ':' + zKey + ':' + dist;
  if (rangeOverrides[oKey]) return rangeOverrides[oKey].slice();

  var tbl = RAW[TKEYS[ti]][zKey] || {};
  var scale = USER_CSS[ti] / BASE_CSS[ti];
  var lo, hi;
  if (tbl[dist]) {
    lo = tbl[dist][0]; hi = tbl[dist][1] + EXT;
  } else {
    // linear interpolation between nearest distances
    var keys = Object.keys(tbl).map(Number).sort(function(a,b){return a-b;});
    if (!keys.length) return [30,45];
    if (dist <= keys[0]) {
      var r0 = dist/keys[0];
      lo = tbl[keys[0]][0]*r0; hi = (tbl[keys[0]][1]+EXT)*r0;
    } else if (dist >= keys[keys.length-1]) {
      var rN = dist/keys[keys.length-1];
      lo = tbl[keys[keys.length-1]][0]*rN; hi = (tbl[keys[keys.length-1]][1]+EXT)*rN;
    } else {
      for (var i=0;i<keys.length-1;i++) {
        if (dist>=keys[i]&&dist<=keys[i+1]) {
          var f=(dist-keys[i])/(keys[i+1]-keys[i]);
          lo=tbl[keys[i]][0]+f*(tbl[keys[i+1]][0]-tbl[keys[i]][0]);
          hi=tbl[keys[i]][1]+f*(tbl[keys[i+1]][1]-tbl[keys[i]][1])+EXT;
          break;
        }
      }
    }
  }
  return [Math.round(lo*scale), Math.round(hi*scale)];
}

// ── Rep-aware fallbacks (rep can override section zone/rest) ─────────────────
function repZ(sec, rep)  { return (rep && rep.zKey) || (sec && sec.zKey) || 'z3'; }
function repR(sec, rep)  { return (rep && rep.rest != null) ? rep.rest : (sec ? sec.restBetween : 0); }

// ── Parser ──────────────────────────────────────────────────────────────────
function cleanLine(l) {
  return l
    .replace(/\*\([^)]*\)\*/g, '')      // strip *(italic notes)* before star removal
    .replace(/\*\*/g, '')               // strip **bold**
    .replace(/\*/g, '')                 // strip *italic*
    .replace(/\u00d7/g, 'x')            // convert × (Unicode multiply) to x
    .replace(/[^\x20-\x7E]/g, ' ')     // strip non-ASCII (em-dash, emoji, arrows)
    .replace(/\/\s*\d+\s*laps?/gi, '') // strip "/ 6 laps" lap notations
    .replace(/^\s*[-—·•>]+\s*/, '')    // strip leading bullets / dashes
    .replace(/\s{2,}/g, ' ')           // collapse multiple spaces
    .trim();
}

function detectZone(line, def) {
  // Handles: "@ Zone 4", "@Z4", "Zone 4", "z4", "Z4"
  var m = line.match(/@\s*[Zz]one\s*(\d)/)
           || line.match(/@\s*[Zz](\d)\b/)
           || line.match(/[Zz]one\s*(\d)/)
           || line.match(/\b[Zz](\d)\b/);
  return m ? 'z' + m[1] : def;
}

function parseSet(text) {
  var rawLines = text.split('\n').map(function(l){ return l.trim(); }).filter(Boolean);

  // ── Pre-process: expand round blocks ──────────────────────────────────────
  // "2 rounds:" followed by indented content lines gets expanded into
  // N copies of those lines with rest inserted between rounds.
  // This must happen BEFORE the main parse loop so that zone auto-splitting
  // naturally creates the correct sequence of sections.
  var lines = [];
  var ri = 0;
  while (ri < rawLines.length) {
    var cl = cleanLine(rawLines[ri]);
    var rndMatch = cl.match(/^(\d+)\s*rounds?\s*:?\s*$/i);
    if (rndMatch) {
      var roundCount = parseInt(rndMatch[1]);
      var roundLines = [];
      var betweenRest = 0;
      ri++;
      // Collect lines belonging to this round block until next section header
      while (ri < rawLines.length) {
        var rl = cleanLine(rawLines[ri]);
        var rlUp = rl.toUpperCase();
        // Stop at section headers
        if (rlUp.match(/\bWARM.?UP\b|^WU\b|^MAIN\b|MAIN\s+SET|PULL|COOL.?DOWN|^CD\b|^LADDER\b|^TEST\b|^EXTENSION\b/)) break;
        // Stop at another "N rounds:" line
        if (rl.match(/^\d+\s*rounds?\s*:?\s*$/i)) break;
        // Check for "between rounds" / "after each round" — extract as the between-rounds content
        var btwMatch = rl.match(/^:?(\d+)(?::(\d{2}))?\s*(.*?)(?:between\s*rounds?|after\s*each\s*round)/i);
        if (btwMatch) {
          betweenRest = rawLines[ri]; // keep the raw line to insert between rounds
          ri++;
          continue;
        }
        roundLines.push(rawLines[ri]);
        ri++;
      }
      // Expand: duplicate round lines N times with between-rounds line inserted
      for (var rr = 0; rr < roundCount; rr++) {
        for (var rj = 0; rj < roundLines.length; rj++) {
          lines.push(roundLines[rj]);
        }
        if (rr < roundCount - 1 && betweenRest) {
          // Strip "between rounds" text and insert as a normal rep/distance line
          var btwLine = cleanLine(betweenRest).replace(/\s*between\s*rounds?\s*/i, ' ').trim();
          lines.push(btwLine);
        }
      }
    } else {
      lines.push(rawLines[ri]);
      ri++;
    }
  }

  var secs = [], cur = null;

  // Process a line of content (reps / items / rest) into current section.
  // Reps can carry their own zone + rest (different from section defaults)
  // so a single Main Set can contain mixed zones without being split.
  function processContent(line) {
    if (!line) return;
    if (!cur) { cur = mkUntimed('warmup','Warm-up','','Warm-up','badge-warmup'); secs.push(cur); }

    // ── Standalone "X:YY rest" or ":NN rest" line (no distances) ──────────
    // Two behaviors depending on where it appears:
    //   • At the TOP of a section (no reps yet) → set-break BEFORE this block,
    //     applied to the previous timed section's restAfterSec.
    //   • In the MIDDLE of a section (after some reps) → extend the rest
    //     AFTER the most recently pushed rep so there's a pause before the
    //     next rep group starts.
    var soloRest = line.match(/^\s*(\d+):(\d{2})\s*r(?:est)?\s*$/i)
                || line.match(/^\s*:(\d+)\s*r(?:est)?\s*$/i);
    if (soloRest && cur && cur.timed) {
      var gapSecs = soloRest[2] !== undefined
        ? parseInt(soloRest[1]) * 60 + parseInt(soloRest[2])
        : parseInt(soloRest[1]);
      if (cur.reps.length === 0) {
        // Top-of-section: apply to previous section as set-break.
        // Also stored as current section's preRestSec so the break runs
        // even if the previous section was untimed (e.g. warm-up).
        var gapLabel = soloRest[2] !== undefined
          ? soloRest[1] + ':' + soloRest[2]
          : ':' + pad(parseInt(soloRest[1]));
        cur.preRestSec = gapSecs;
        cur.preRestLabel = gapLabel;
        if (secs.length >= 2) {
          var prev = secs[secs.length - 2];
          prev.restAfterSec = gapSecs;
          prev.restAfterLabel = gapLabel;
        }
      } else {
        // Mid-section: extend last rep's rest so there's a pause before next group
        cur.reps[cur.reps.length - 1].rest = gapSecs;
      }
      return;
    }

    // Rest between reps (e.g. ":45 rest", ":20r", ":15 seconds rest")
    var rm = line.match(/:(\d+)\s*(?:sec(?:ond)?s?\s+)?r(?:est)?\b/i);

    // Line-level zone (tagged onto reps from this line; does NOT split section)
    var lineZone = cur.timed ? detectZone(line, null) : null;
    // Line-level rest (in seconds) — used to tag individual reps
    var lineRest = rm ? parseInt(rm[1]) : null;

    // "N rounds:" as standalone line — sets rounds on current timed section
    var rndLine = line.match(/^(\d+)\s*rounds?\s*:?$/i);
    if (rndLine && cur && cur.timed) { cur.rounds = parseInt(rndLine[1]); return; }

    // Between-rounds rest: ":30 between rounds", "1:00 between rounds", "60 easy between rounds", ":30 rest after each round"
    var btw = line.match(/:?(\d+)(?::(\d{2}))?\s*(?:\w+\s+)?(?:between\s*rounds?|after\s*each\s*round)/i);
    if (btw && cur && cur.timed) {
      cur.roundBreakRest = btw[2] !== undefined
        ? parseInt(btw[1]) * 60 + parseInt(btw[2])
        : parseInt(btw[1]);
      return;
    }

    // Standalone "N:NN rest" / "1:30 rest" or lines starting with "Rest:"
    // These denote set-level rest (after this section), not per-rep rest.
    var rm2 = line.match(/(\d+):(\d+)\s*rest/i);
    if (rm2 && cur.timed && !rm) {
      cur.restAfterSec = parseInt(rm2[1])*60+parseInt(rm2[2]);
      cur.restAfterLabel = rm2[1]+':'+rm2[2];
    }

    // Apply line-level rest as section default if section has none yet
    if (cur.timed && lineRest != null && !cur.restBetween) cur.restBetween = lineRest;

    // Equipment
    if (line.match(/paddle|buoy|fins|snorkel|band/i) && cur.timed) {
      cur.equipment = line.replace(/,?\s*:?\d+\s*r(?:est)?.*$/i,'').replace(/@.*$/i,'').trim();
      if (!line.match(/\d+\s*[xX×]\s*\d+/) && !line.match(/^\d+/)) return;
    }

    // Helper to build a rep with optional per-rep zone/rest overrides
    function mkRep(d) {
      var r = { dist: d, laps: Math.max(1, Math.round(d/POOL_LEN)) };
      if (lineZone && lineZone !== cur.zKey) r.zKey = lineZone;
      if (lineRest != null && lineRest !== cur.restBetween) r.rest = lineRest;
      return r;
    }

    // Dash-list: 108-72-36-72-108
    var dm = line.match(/^(\d+(?:-\d+)+)/);
    if (dm && cur.timed) {
      dm[1].split('-').forEach(function(d){ var n=parseInt(d); if(n>=10) cur.reps.push(mkRep(n)); });
      return;
    }

    // NxDist: "4x80", "3 x 100", "4×216"
    var xm = line.match(/(\d+)\s*[xX×]\s*(\d+)/);
    if (xm && cur.timed) {
      var cnt=parseInt(xm[1]), d2=parseInt(xm[2]);
      for (var j=0;j<cnt;j++) cur.reps.push(mkRep(d2));
      return;
    }

    // Single distance: "108m (3 laps) free", "100 back"
    var sm = line.match(/^(\d+)/);
    if (sm && parseInt(sm[1]) >= 10) {
      var ds = parseInt(sm[1]);
      if (cur.timed) cur.reps.push(mkRep(ds));
      else cur.items.push(line);
      return;
    }

    // Anything else goes to items for untimed sections
    if (!cur.timed && line.length > 1) cur.items.push(line);
  }

  for (var i = 0; i < lines.length; i++) {
    var raw = lines[i], line = cleanLine(raw), up = line.toUpperCase();
    if (!line) continue;

    // ── Standalone "Rest: time" lines between sections ───────────────────────
    // e.g. "**Rest:** 1:00" or "Rest: :30" — these sit BETWEEN sections in
    // the source text. They denote the gap before the next section starts,
    // so apply to the current (previous) section's restAfterSec.
    var restLine = line.match(/^rest\s*:?\s+(\d+):(\d{2})/i) || line.match(/^rest\s*:?\s+:(\d+)/i);
    if (restLine) {
      if (cur) {
        var rSec = restLine[2] !== undefined
          ? parseInt(restLine[1])*60 + parseInt(restLine[2])
          : parseInt(restLine[1]);
        var rLbl = restLine[2] !== undefined
          ? restLine[1] + ':' + restLine[2]
          : ':' + pad(parseInt(restLine[1]));
        cur.restAfterSec = rSec;
        cur.restAfterLabel = rLbl;
      }
      continue;
    }

    // ── WARM-UP header ──────────────────────────────────────────────────────
    if (up.match(/\bWARM.?UP\b|^WU\b/)) {
      cur = mkUntimed('warmup','Warm-up','','Warm-up','badge-warmup');
      secs.push(cur);
      // Handle same-line items: "Warm-up: 100 free, 100 back"
      var afterWU = line.replace(/warm.?up\s*:?\s*/i,'').trim();
      if (afterWU) afterWU.split(',').forEach(function(it){ var t=it.trim(); if(t) cur.items.push(t); });
      continue;
    }

    // ── "Main:" label prefix — treat as rep line, NOT a new section ─────────
    // e.g. "Main: 4x80 @ Zone 4" or "Main: 3x100"
    var isMainLabel = /^main\s*:/i.test(line) && /\d/.test(line);
    if (isMainLabel) {
      var repPart = line.replace(/^main\s*:\s*/i,'').trim();
      // If no timed section exists yet, create a default main section
      if (!cur || !cur.timed) {
        var zl = detectZone(repPart, 'z3');
        cur = mkTimed('main','Main Set','',zl,0,0,'');
        secs.push(cur);
      }
      processContent(repPart);
      continue;
    }

    // ── MAIN SET section header ──────────────────────────────────────────────
    // "MAIN SET", "MAIN LADDER", or transition lines containing "MAIN SET"
    // but NOT "Main: Nx..." (handled above)
    var isMainHeader = up.match(/MAIN\s+SET|MAIN\s+LADDER/)
      || (up === 'MAIN')
      || (up.indexOf('MAIN') >= 0 && up.match(/ZONE|LADDER/) && !isMainLabel)
      || (up.indexOf('MAIN') >= 0 && up.match(/\bZ[2-5]\b/) && !isMainLabel);
    if (isMainHeader) {
      var z = detectZone(line,'z3');
      var rndM = line.match(/\((\d+)\s*rounds?\)/i);
      var rndN = rndM ? parseInt(rndM[1]) : 1;
      var mainTitle = 'Main Set'+(rndN>1?' ×'+rndN:'');
      cur = mkTimed('main',mainTitle,'',z,0,0,'');
      cur.rounds = rndN;
      secs.push(cur);
      continue;
    }

    // ── LADDER / TEST / EXTENSION headers (treated as timed main-style sections) ─
    var isLadderHeader = up.match(/^LADDER\b/) || (up.indexOf('LADDER') >= 0 && up.indexOf('@') >= 0);
    if (isLadderHeader) {
      var zLad = detectZone(line,'z3');
      cur = mkTimed('main','Ladder','',zLad,0,0,'');
      secs.push(cur);
      continue;
    }
    if (up === 'TEST' || up.match(/^TEST\b/)) {
      var zTest = detectZone(line,'z4');
      cur = mkTimed('main','Test Set','',zTest,30,0,'');
      secs.push(cur);
      continue;
    }
    if (up === 'EXTENSION' || up.match(/^EXTENSION\b/)) {
      var zExt = detectZone(line,'z3');
      cur = mkTimed('main','Extension','',zExt,0,0,'');
      secs.push(cur);
      continue;
    }

    // ── PULL SET header ──────────────────────────────────────────────────────
    if (up.indexOf('PULL') >= 0 && !up.match(/^\d/)) {
      var zp = detectZone(line,'z2');
      cur = mkTimed('pull','Pull Set — Zone '+zp.slice(1),'paddles + pull buoy',zp,20,30,':30');
      cur.equipment = 'paddles + pull buoy';
      secs.push(cur);
      continue;
    }

    // ── COOL-DOWN header ─────────────────────────────────────────────────────
    if (up.match(/\bCOOL.?DOWN\b|^CD\b/)) {
      cur = mkUntimed('cooldown','Cool-down','','Cool-down','badge-cooldown');
      secs.push(cur);
      continue;
    }

    // ── Content line (reps, items, rest info) ─────────────────────────────────
    processContent(line);
  }

  // Expand rounds: multiply reps by round count, mark round breaks
  secs.forEach(function(s) {
    if (!s.timed || s.rounds <= 1 || !s.reps.length) return;
    var base = s.reps.slice();
    var allReps = [];
    for (var r = 0; r < s.rounds; r++) {
      for (var k = 0; k < base.length; k++) {
        allReps.push({
          dist: base[k].dist,
          laps: base[k].laps,
          roundEnd: (k === base.length-1 && r < s.rounds-1)
        });
      }
    }
    s.reps = allReps;
  });

  // Remove timed sections that ended up with no reps (phantom sections)
  secs = secs.filter(function(s){ return !s.timed || s.reps.length > 0; });
  return secs.length ? secs : [mkTimed('main','Main Set','','z3',20,0,'')];
}
function mkUntimed(id,title,sub,badge,badgeCls) {
  return {id:id,timed:false,title:title,sub:sub,badge:badge,badgeCls:badgeCls,items:[]};
}
function mkTimed(id,title,sub,zKey,restBetween,restAfterSec,restAfterLabel) {
  return {id:id,timed:true,title:title,sub:sub,badge:'Zone '+zKey.slice(1),
    badgeCls:'badge-z'+zKey.slice(1),zKey:zKey,
    restBetween:restBetween,restAfterSec:restAfterSec,restAfterLabel:restAfterLabel,
    rounds:1,roundBreakRest:0,reps:[]};
}

// ── State ────────────────────────────────────────────────────────────────────
var SECS = [];
var secIdx = 0;
var TS = [0,1,2].map(function(){
  return {ri:0,phase:'ready',elapsed:0,restDur:0,swimRes:null,results:[]};
});
var running = false, paused = false, lastTs = null, raf = null;
var GRACE = 0; // ms after hi before auto-advance (0 = immediate)

function mkState(si) { return {si:si||0,ri:0,phase:'ready',elapsed:0,restDur:0,swimRes:null,results:[],paused:false}; }

// ── Launch ───────────────────────────────────────────────────────────────────
function launch() {
  var txt = document.getElementById('setInput').value.trim();
  if (!txt) { alert('Paste a swim set first!'); return; }

  USER_CSS[0] = parseFloat(document.getElementById('css0').value)||66;
  USER_CSS[1] = parseFloat(document.getElementById('css1').value)||68;
  USER_CSS[2] = parseFloat(document.getElementById('css2').value)||71;
  POOL_LEN = parseFloat(document.getElementById('poolLen').value)||36;

  SECS = parseSet(txt);
  secIdx = 0;

  document.getElementById('tn0').textContent = '1';
  document.getElementById('tn1').textContent = '2';
  document.getElementById('tn2').textContent = '3';
  document.getElementById('tns0').textContent = document.getElementById('t1names').value;
  document.getElementById('tns1').textContent = document.getElementById('t2names').value;
  document.getElementById('tns2').textContent = document.getElementById('t3names').value;

  rangeOverrides = {};

  document.getElementById('setupView').classList.remove('active');
  document.getElementById('clockView').classList.add('active');

  // Apply tier count — hide unused clock columns
  document.querySelectorAll('.clock-col').forEach(function(col, i){
    col.style.display = i < TIER_COUNT ? '' : 'none';
  });

  TS = [mkState(secIdx),mkState(secIdx),mkState(secIdx)];
  running = false; paused = false;
  renderAll();
}

function goBack() {
  stopLoop();
  document.getElementById('clockView').classList.remove('active');
  document.getElementById('setupView').classList.add('active');
}

function loadExample() {
  document.getElementById('setInput').value =
"WARM-UP\n108m free (3 laps)\n72m kick (2 laps)\n108m choice\n4x36 build to Z3, :10 rest\n\nMAIN SET — Zone 3\n:20 rest between reps\n108-72-36-72-108-72-36-72-108\n\nPULL SET — Zone 2\npaddles + pull buoy, :20 rest\n4x216\n\nCOOL-DOWN\n108m back\n108m easy free";
}

// ── AI Clean (calls server-side proxy at /api/ai-clean) ──────────────────────
// Absolute URL so this works when the page is embedded on smwphub.com,
// opened from a local file://, or served directly from Render.
var AI_CLEAN_URL = 'https://stanford-swim-clock.onrender.com/api/ai-clean';
async function aiClean() {
  var input = document.getElementById('setInput');
  var btn = document.getElementById('aiCleanBtn');
  var icon = document.getElementById('aiIcon');
  var status = document.getElementById('aiStatus');
  var txt = input.value.trim();

  if (!txt) { status.textContent = 'Paste a set first'; setTimeout(function(){ status.textContent=''; }, 2000); return; }

  // Disable button, show spinner
  btn.disabled = true;
  icon.innerHTML = '<span class="ai-spin">⟳</span>';
  status.textContent = 'Cleaning...';

  try {
    var resp = await fetch(AI_CLEAN_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        text: txt,
        poolLength: document.getElementById('poolLen').value || '36'
      })
    });

    var data = await resp.json();
    if (!resp.ok) throw new Error(data.error || ('Server error ' + resp.status));

    input.value = data.cleaned;
    // Trigger preview update
    input.dispatchEvent(new Event('input'));

    status.textContent = '✓ Cleaned';
    setTimeout(function(){ status.textContent=''; }, 3000);

  } catch(err) {
    status.textContent = '✕ ' + (err.message || 'Failed');
    console.error('AI Clean error:', err);
  } finally {
    btn.disabled = false;
    icon.innerHTML = '✨';
  }
}

// ── Timer control ─────────────────────────────────────────────────────────────
function startTimers() {
  if (running) return;
  running = true; paused = false;
  TS.forEach(function(s){ if (s.phase==='ready') { s.phase='countdown'; s.elapsed=0; s.countdownDur=10000; } });
  lastTs = null;
  raf = requestAnimationFrame(loop);
  renderAll();
}

function pauseTimers() {
  if (!running) return;
  running = false; paused = true;
  TS.forEach(function(s){ s.paused = true; });
  stopLoop();
  renderAll();
}

function resumeTimers() {
  if (running) return;
  running = true; paused = false;
  TS.forEach(function(s){ s.paused = false; });
  lastTs = null;
  raf = requestAnimationFrame(loop);
  renderAll();
}

function resetTimers() {
  stopLoop();
  TS = [mkState(secIdx),mkState(secIdx),mkState(secIdx)];
  running = false; paused = false;
  renderAll();
}

// ── Per-tier controls ────────────────────────────────────────────────────────
function pauseTier(ti) {
  TS[ti].paused = true;
  // If all active tiers are now paused or done, stop the RAF to save resources
  var anyActive = TS.some(function(s,i){ return i<TIER_COUNT && !s.paused && s.phase!=='done' && s.phase!=='ready'; });
  if (!anyActive) { running=false; if(raf){cancelAnimationFrame(raf);raf=null;} }
  paused = TS.slice(0,TIER_COUNT).every(function(s){ return s.paused || s.phase==='done' || s.phase==='ready'; });
  renderClocks();
  renderControls();
}

function resumeTier(ti) {
  TS[ti].paused = false;
  paused = TS.slice(0,TIER_COUNT).every(function(s){ return s.paused || s.phase==='done' || s.phase==='ready'; });
  if (!running) {
    running = true; lastTs = null;
    raf = requestAnimationFrame(loop);
  }
  renderClocks();
  renderControls();
}

function resetTier(ti) {
  var curSi = TS[ti].si;
  TS[ti] = mkState(curSi);
  // Drop into swim immediately if other tiers are mid-set
  if (running || TS.some(function(s,i){ return i!==ti && (s.phase==='swim'||s.phase==='rest'); })) {
    TS[ti].phase = 'swim';
    if (!running) { running=true; lastTs=null; raf=requestAnimationFrame(loop); }
  }
  renderClocks();
  renderControls();
  renderHero();
}

function skipRep() {
  TS.forEach(function(s){
    var sec = SECS[s.si];
    if (!sec||!sec.timed) return;
    if (s.phase==='swim'||s.phase==='rest') {
      s.results[s.ri] = 'skip';
      s.ri++;
      if (s.ri>=sec.reps.length) {
        s.phase = sec.restAfterSec>0 ? 'brk' : 'done';
        s.restDur = sec.restAfterSec*1000;
        s.elapsed = 0;
      } else {
        s.phase='swim'; s.elapsed=0; s.swimRes=null;
      }
    }
  });
  renderAll();
}

function goNextSection() {
  if (secIdx<SECS.length-1) {
    stopLoop();
    secIdx++;
    TS = [mkState(secIdx),mkState(secIdx),mkState(secIdx)];
    running = false; paused = false;
    renderAll();
  }
}

function jumpSection(si) {
  if (si===secIdx) return;
  stopLoop();
  secIdx=si;
  TS=[mkState(si),mkState(si),mkState(si)];
  running=false; paused=false;
  renderAll();
}

function stopLoop() {
  running=false;
  if (raf) { cancelAnimationFrame(raf); raf=null; }
}

// ── Loop ─────────────────────────────────────────────────────────────────────
function loop(ts) {
  if (!running) return;
  if (lastTs!==null) {
    var dt = ts-lastTs;
    // Each tier steps through its own current section independently
    TS.forEach(function(s,ti){
      if (ti>=TIER_COUNT) return;
      var sec = SECS[s.si];
      if (sec&&sec.timed) step(s,ti,sec,dt);
    });
  }
  lastTs=ts;
  // Global secIdx follows Tier 0 for hero/tabs display
  secIdx = TS[0].si;
  renderClocks();
  renderHero();
  if (TS.slice(0,TIER_COUNT).every(function(s){return s.phase==='done';})) {
    running=false; renderControls(); return;
  }
  raf=requestAnimationFrame(loop);
}

function beepTick() {
  var ctx = getAudio(); if (!ctx) return;
  var t = ctx.currentTime;
  var osc = ctx.createOscillator();
  osc.type = 'sine'; osc.frequency.value = 880;
  var g = ctx.createGain();
  g.gain.setValueAtTime(0.3, t);
  g.gain.linearRampToValueAtTime(0, t + 0.08);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(t); osc.stop(t + 0.1);
}

function step(s, ti, sec, dt) {
  if (s.phase==='done' || s.paused) return;
  if (s.phase==='countdown') {
    var prevSec = Math.ceil((s.countdownDur - s.elapsed) / 1000);
    s.elapsed += dt;
    var curSec = Math.ceil((s.countdownDur - s.elapsed) / 1000);
    if (curSec < prevSec && curSec > 0) beepTick();
    if (s.elapsed >= s.countdownDur) {
      s.phase = 'swim'; s.elapsed = 0; s.swimRes = null;
      beepGo(ti);
    }
    return;
  }
  s.elapsed+=dt;
  var elS=s.elapsed/1000;
  var rep=sec.reps[Math.min(s.ri,sec.reps.length-1)];
  var pace=getPace(ti,repZ(sec,rep),rep.dist);
  var lo=pace[0],hi=pace[1];

  if (s.phase==='swim') {
    if (elS>lo && !s.swimRes) s.swimRes='ok';
    if (elS>hi) s.swimRes='miss';
    if (elS >= hi+GRACE/1000) {
      s.results[s.ri]=s.swimRes||'miss';
      s.ri++;
      s.elapsed=0; s.swimRes=null;
      if (s.ri>=sec.reps.length) {
        s.phase=sec.restAfterSec>0?'brk':'done';
        s.restDur=sec.restAfterSec*1000;
      } else {
        var prevRep=sec.reps[s.ri-1];
        // Per-rep rest: each rep carries over its rest to the break that follows.
        var restSecs=(prevRep&&prevRep.roundEnd&&sec.roundBreakRest>0)?sec.roundBreakRest:repR(sec,prevRep);
        s.phase='rest'; s.restDur=restSecs*1000;
      }
    }
  } else if (s.phase==='rest') {
    if (s.elapsed>=s.restDur) {
      s.elapsed=0; s.swimRes=null; s.phase='swim';
      beepGo(ti);
    }
  } else if (s.phase==='brk') {
    if (s.elapsed>=s.restDur) {
      // Find next timed section for this tier independently
      var nextSi = s.si+1;
      while (nextSi<SECS.length && !SECS[nextSi].timed) nextSi++;
      if (nextSi<SECS.length) {
        s.si=nextSi; s.ri=0; s.elapsed=0; s.swimRes=null; s.results=[];
        s.restDur=SECS[nextSi].restBetween*1000;
        s.phase='swim';
        beepGo(ti); // whistle when this tier starts the next set
      } else {
        s.phase='done';
      }
    }
  }
}

// ── Render all ────────────────────────────────────────────────────────────────
function renderAll() { renderTabs(); renderHero(); renderControls(); renderClocks(); }

function renderTabs() {
  document.getElementById('topBar').innerHTML = SECS.map(function(sec,si){
    var cls='', st='upcoming';
    if(si<secIdx){cls='s-done';st='done';}
    else if(si===secIdx){cls='s-active';st='now';}
    var short=sec.title.replace(/ [-—].*/,'').replace('Warm-up','WU').replace('Cool-down','CD');
    return '<div class="sec-tab '+cls+'" onclick="jumpSection('+si+')"><div class="tt">'+short+'</div><div class="ts">'+st+'</div></div>';
  }).join('');
}

function renderHero() {
  var sec=SECS[secIdx]; if(!sec) return;
  var el=document.getElementById('hero');
  var sub='';
  if (sec.timed) {
    var ri=TS[0].ri, ph=TS[0].phase;
    var items=sec.reps.map(function(r,i){
      var label='<small style="display:block;font-size:0.7em;font-weight:700;color:#e8b830;letter-spacing:0.06em">'+r.laps+' laps</small>'+r.dist+'m';
      var isDone=(i<ri)||(ph==='done'||ph==='brk');
      var isCur=(i===ri&&ph!=='brk'&&ph!=='done');
      var cls=isDone?'done':isCur?'cur':'plain';
      return '<span class="hi '+cls+'">'+label+'</span>';
    }).join('');
    var restNote=sec.restBetween?'<span class="hero-rest">:'+pad(sec.restBetween)+' rest</span>':'';
    var eq=sec.equipment?'<span class="hero-eq">'+sec.equipment+'</span>':'';
    sub='<div class="hero-items">'+items+restNote+eq+'</div>';
  } else if (sec.items&&sec.items.length) {
    sub='<div class="hero-items-wrap">'+sec.items.map(function(it){return '· '+it;}).join('\n')+'</div>';
  }
  el.innerHTML='<span class="hero-title">'+sec.title+'</span>'+(sec.equipment?'<span class="hero-eq">'+sec.equipment+'</span>':'')+sub;
}

function pad(n){return n<10?'0'+n:''+n;}

function renderControls() {
  var sec=SECS[secIdx]; if(!sec) return;
  var ctrl=document.getElementById('bottomBar');
  var isLast=secIdx===SECS.length-1;

  if (!sec.timed) {
    var nxt=isLast?'Workout Complete':'▶ '+SECS[secIdx+1].title;
    ctrl.innerHTML='<span class="back-link" onclick="goBack()">◀ Edit Set</span>'+(isLast
      ?'<button class="btn btn-gray" disabled>Workout Complete</button>'
      :'<button class="btn btn-green" onclick="goNextSection()">'+nxt+'</button>');
    return;
  }

  var allDone=TS.slice(0,TIER_COUNT).every(function(s){return s.phase==='done';});
  var html='<span class="back-link" onclick="goBack()">◀ Edit Set</span>';
  if (allDone) {
    html+='<button class="btn btn-green" onclick="goNextSection()">'+(isLast?'✓ Finish':'▶ '+(SECS[secIdx+1]?SECS[secIdx+1].title:'Next'))+'</button>';
    html+='<button class="btn btn-gray" onclick="resetTimers()">↺ Reset</button>';
  } else if (running) {
    html+='<button class="btn btn-orange" onclick="pauseTimers()">⏸ Pause</button>';
    html+='<button class="btn btn-yellow" onclick="skipRep()">⏭ Skip Rep</button>';
    html+='<button class="btn btn-gray" onclick="resetTimers()">↺ Reset</button>';
  } else if (paused) {
    html+='<button class="btn btn-green" onclick="resumeTimers()">▶ Resume</button>';
    html+='<button class="btn btn-yellow" onclick="skipRep()">⏭ Skip Rep</button>';
    html+='<button class="btn btn-gray" onclick="resetTimers()">↺ Reset</button>';
  } else {
    html+='<button class="btn btn-green" onclick="startTimers()">▶ Start</button>';
    html+='<button class="btn btn-gray" onclick="resetTimers()">↺ Reset</button>';
  }
  ctrl.innerHTML=html;
}

function renderClocks() {
  for (var ti=0;ti<3;ti++) {
    var cb=document.getElementById('cb'+ti);
    var tb=document.getElementById('tb'+ti);
    var s=TS[ti];
    var sec=SECS[s.si];
    if(!sec||!sec.timed) {
      var nxt=null;
      for(var si=(s.si)+1;si<SECS.length;si++){if(SECS[si].timed){nxt=SECS[si];break;}}
      cb.className='cbody st';
      cb.innerHTML='<div class="standby-msg">'+(sec?sec.title.toUpperCase():'READY')+'<span>'+(nxt?'timers on '+nxt.title:'')+'</span></div>';
      if(tb) tb.innerHTML='';
    } else {
      renderClock(ti, s, sec, cb);
      if(tb) renderTierBtns(ti, tb);
    }
  }
}

function renderTierBtns(ti, tb) {
  var s=TS[ti];
  var active=s.phase==='swim'||s.phase==='rest'||s.phase==='brk'||s.phase==='countdown';
  if (!active) { tb.innerHTML=''; return; }
  var pauseBtn = s.paused
    ? '<button class="tier-btn tb-resume" data-action="resume" data-ti="'+ti+'">▶ Resume</button>'
    : '<button class="tier-btn tb-pause" data-action="pause" data-ti="'+ti+'">⏸ Pause</button>';
  tb.innerHTML = pauseBtn +
    '<button class="tier-btn tb-reset" data-action="reset" data-ti="'+ti+'">↺ Reset</button>';
}

// Event delegation for tier buttons — mousedown fires before next RAF can rebuild DOM
document.addEventListener('mousedown', function(e) {
  var btn = e.target.closest('.tier-btn');
  if (!btn) return;
  var ti = parseInt(btn.getAttribute('data-ti'));
  var action = btn.getAttribute('data-action');
  if (isNaN(ti)) return;
  e.preventDefault();
  e.stopPropagation();
  if (action === 'pause') pauseTier(ti);
  else if (action === 'resume') resumeTier(ti);
  else if (action === 'reset') resetTier(ti);
});
// Also handle touch for mobile
document.addEventListener('touchstart', function(e) {
  var btn = e.target.closest('.tier-btn');
  if (!btn) return;
  var ti = parseInt(btn.getAttribute('data-ti'));
  var action = btn.getAttribute('data-action');
  if (isNaN(ti)) return;
  e.preventDefault();
  if (action === 'pause') pauseTier(ti);
  else if (action === 'resume') resumeTier(ti);
  else if (action === 'reset') resetTier(ti);
}, {passive: false});

// Build a vertical set list. highlightIdx = which rep to highlight (-1 = none, 0 = first, etc.)
function buildSetList(ti, sec, reps, highlightIdx) {
  // Detect whether rests vary across reps — if so, show rest on every row
  var anyRestOverride = false;
  for (var _i = 0; _i < sec.reps.length; _i++) {
    if (sec.reps[_i].rest != null && sec.reps[_i].rest !== sec.restBetween) { anyRestOverride = true; break; }
  }
  // Group consecutive reps sharing dist + zone + rest for cleaner display
  var groups = [], prev = null;
  reps.forEach(function(r, i) {
    var rz = r.zKey || null, rr = r.rest != null ? r.rest : null;
    if (prev && prev.dist === r.dist && prev.z === rz && prev.r === rr) {
      prev.count++;
      prev.indices.push(i);
    } else {
      prev = {dist: r.dist, laps: r.laps, count: 1, indices: [i], z: rz, r: rr};
      groups.push(prev);
    }
  });
  return groups.map(function(g) {
    // Use first rep in group for zone lookup (reps in a group share dist, usually zone too)
    var gRep = sec.reps[g.indices[0]];
    var pace = getPace(ti, repZ(sec, gRep), g.dist);
    var isCur = g.indices.indexOf(highlightIdx) >= 0;
    var cls = 'set-row' + (isCur ? ' sr-cur' : '');
    var prefix = g.count > 1 ? g.count + '×' : '';
    var effZ = repZ(sec, gRep);
    var effRest = (gRep && gRep.rest != null) ? gRep.rest : sec.restBetween;
    var zTag = '<span class="sr-zone z-'+effZ+'">Zone '+effZ.slice(1)+'</span>';
    // Show rest on every row when any rep overrides (so :10 and :15 both display)
    var showRest = anyRestOverride && effRest;
    var rTag = showRest ? '<span class="sr-rest">:'+pad(effRest)+' rest</span>' : '';
    return '<div class="'+cls+'">'+
      '<div class="sr-num">'+ prefix +'</div>'+
      '<div class="sr-dist">'+g.dist+'m <span class="sr-laps">('+g.laps+'L)</span></div>'+
      '<div class="sr-meta">'+zTag+rTag+'</div>'+
      '<div class="sr-target">'+fmtS(pace[0])+'–'+fmtS(pace[1])+'</div>'+
    '</div>';
  }).join('');
}

function renderClock(ti, s, sec, cb) {
  var reps=sec.reps; if(!reps||!reps.length) return;
  var ri=Math.min(s.ri,reps.length-1);
  var rep=reps[ri];
  var pace=getPace(ti,repZ(sec,rep),rep.dist);
  var lo=pace[0],hi=pace[1];

  // dots
  var dots=reps.map(function(r,di){
    var c='dot';
    if(di<s.ri) c+=(s.results[di]==='miss'||s.results[di]==='skip')?' dm':' dd';
    else if(di===s.ri&&s.phase==='swim') c+=' dc';
    return '<div class="'+c+'"></div>';
  }).join('');

  var dotsH='<div class="c-dots">'+dots+'</div>';

  if (s.phase==='done') {
    // Find cool-down section if it exists
    var cdSec = null;
    for (var _ci=0;_ci<SECS.length;_ci++) { if (SECS[_ci].id==='cooldown') { cdSec=SECS[_ci]; break; } }
    var cdHtml = '';
    // Only show cool-down when this is the last timed section (no more timed sections after)
    var hasMoreTimed = false;
    for (var _mi=s.si+1;_mi<SECS.length;_mi++) { if (SECS[_mi].timed) { hasMoreTimed=true; break; } }
    if (cdSec && cdSec.items && cdSec.items.length && !hasMoreTimed) {
      cdHtml = '<div style="margin-top:12px;text-align:center">' +
        '<div style="font-size:0.7rem;font-weight:700;color:#c0392b;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:6px">Cool-Down</div>' +
        cdSec.items.map(function(it){ return '<div style="font-size:0.85rem;color:#d4b0b0;margin-bottom:3px">'+it+'</div>'; }).join('') +
        '</div>';
    }
    cb.className='cbody dn';
    cb.innerHTML=dotsH+'<div class="c-time tb" style="font-size:3.5rem">DONE</div><div class="c-badge bb">SET COMPLETE</div>'+cdHtml;
    return;
  }
  if (s.phase==='ready') {
    cb.className='cbody rd';
    var setRows = buildSetList(ti, sec, reps, -1);
    // Only show section-wide "rest between reps" header if ALL reps share the
    // section default (no per-rep overrides). Otherwise the badges on each
    // row tell the real story and a single header is misleading.
    var anyOverride = false;
    for (var _ri = 0; _ri < sec.reps.length; _ri++) {
      if (sec.reps[_ri].rest != null && sec.reps[_ri].rest !== sec.restBetween) { anyOverride = true; break; }
    }
    var restInfo = (sec.restBetween && !anyOverride) ? '<div style="font-size:1.1rem;color:#e8b830;font-weight:700;margin:6px 0">:'+pad(sec.restBetween)+' rest between reps</div>' : '';
    var eqInfo = sec.equipment ? '<div style="font-size:1rem;color:#a06060;font-style:italic">'+sec.equipment+'</div>' : '';
    cb.innerHTML=
      '<div style="font-size:1.4rem;font-weight:800;color:#c0392b;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:8px">'+sec.title+'</div>'+
      restInfo + eqInfo +
      '<div class="set-list" style="margin:10px 0">'+setRows+'</div>'+
      '<div class="standby-msg" style="font-size:1.2rem;margin-top:8px">READY<span>Press Start</span></div>';
    return;
  }
  if (s.phase==='countdown') {
    var cdRem = Math.max(0, Math.ceil((s.countdownDur - s.elapsed) / 1000));
    var firstRep = reps[0];
    var firstPace = getPace(ti, repZ(sec, firstRep), firstRep.dist);
    var firstZ = repZ(sec, firstRep);
    cb.className='cbody rd';
    cb.innerHTML=dotsH+
      '<div class="c-rep-lbl" style="letter-spacing:0.15em">GET READY</div>'+
      '<div class="c-zone-wrap"><span class="c-zone-badge z-'+firstZ+'">Zone '+firstZ.slice(1)+'</span></div>'+
      '<div class="c-laps">'+firstRep.laps+' laps</div>'+
      '<div class="c-dist">'+firstRep.dist+'m</div>'+
      '<div class="c-time tw" style="font-size:7rem">'+cdRem+'</div>'+
      '<div class="c-badge by">STARTING IN '+cdRem+'s</div>'+
      '<div class="c-target">Target: <b>'+fmtS(firstPace[0])+' – '+fmtS(firstPace[1])+'</b></div>';
    return;
  }
  if (s.phase==='brk') {
    var remB=Math.max(0,s.restDur-s.elapsed)/1000;
    // Find next timed section for this tier
    var nxtSi=s.si+1;
    while(nxtSi<SECS.length && !SECS[nxtSi].timed) nxtSi++;
    var nxtSec=SECS[nxtSi]||null;
    var nxtHtml='';
    if (nxtSec && nxtSec.reps.length) {
      var nxtRows = buildSetList(ti, nxtSec, nxtSec.reps, 0);
      var nxtRestInfo = nxtSec.restBetween ? '<div style="font-size:0.65rem;color:#e8b830;font-weight:600;margin-bottom:3px">:'+pad(nxtSec.restBetween)+' rest</div>' : '';
      nxtHtml=
        '<div class="c-next-lbl" style="margin-top:8px;font-size:0.65rem">Up Next</div>'+
        '<div style="font-size:0.95rem;font-weight:800;color:#e8b830;text-align:center;margin-bottom:4px">'+nxtSec.title+'</div>'+
        nxtRestInfo +
        '<div class="set-list" style="margin:3px 0">'+nxtRows+'</div>';
    } else {
      // No more timed sections — show cool-down if it exists
      var _cdSec2 = null;
      for (var _c2=0;_c2<SECS.length;_c2++) { if (SECS[_c2].id==='cooldown') { _cdSec2=SECS[_c2]; break; } }
      if (_cdSec2 && _cdSec2.items && _cdSec2.items.length) {
        nxtHtml = '<div style="margin-top:10px;text-align:center">' +
          '<div style="font-size:0.75rem;font-weight:700;color:#c0392b;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:8px">Up Next: Cool-Down</div>' +
          _cdSec2.items.map(function(it){ return '<div style="font-size:1.1rem;color:#d4b0b0;margin-bottom:4px;font-weight:600">'+it+'</div>'; }).join('') +
          '</div>';
      }
    }
    cb.className='cbody brk';
    cb.innerHTML=dotsH+
      '<div class="c-rep-lbl">Set Break</div>'+
      '<div class="c-time ty">'+fmtS(remB)+'</div>'+
      '<div class="c-badge by">REST '+fmtShort(remB)+'</div>'+
      nxtHtml;
    return;
  }

  var elS=s.elapsed/1000;

  if (s.phase==='swim') {
    var bodyClass,timeCls,badgeText,badgeCls;
    if (elS<lo) {
      bodyClass='sw0';timeCls='tw';badgeText='';badgeCls='';
    } else if (elS<=hi) {
      bodyClass='swg';timeCls='tg';badgeText='✓ IN RANGE';badgeCls='bg';
    } else {
      bodyClass='swr';timeCls='tr';badgeText='✗ MISSED';badgeCls='br';
    }
    var hasNext=s.ri+1<reps.length;
    var nxtRep=reps[s.ri+1];
    var badgeHtml=badgeText?'<div class="c-badge '+badgeCls+'">'+badgeText+'</div>':'';

    var curZ = repZ(sec, rep);
    cb.className='cbody '+bodyClass;
    cb.innerHTML=dotsH+
      '<div class="c-rep-lbl">Rep <span class="c-rep-num">'+(ri+1)+'/'+reps.length+'</span></div>'+
      '<div class="c-zone-wrap"><span class="c-zone-badge z-'+curZ+'">Zone '+curZ.slice(1)+'</span></div>'+
      '<div class="c-laps">'+rep.laps+' laps</div>'+
      '<div class="c-dist">'+rep.dist+'m</div>'+
      (s.paused?'<div class="paused-tag">PAUSED</div>':'')+
      '<div class="c-time '+timeCls+'">'+fmtMs(s.elapsed)+'</div>'+
      badgeHtml+
      '<div class="c-target">Target: <b'+(elS>hi?' class="red"':'')+'>'+fmtS(lo)+' – '+fmtS(hi)+'</b> <button class="edit-range-btn" onclick="openRangePopup('+ti+',\''+repZ(sec,rep)+'\','+rep.dist+',this)">✏</button></div>'+
      (hasNext?'<div class="c-next">Next: <b>'+nxtRep.dist+'m</b></div>':'<div class="c-next" style="color:#196f3d">Last rep</div>');
    return;
  }

  if (s.phase==='rest') {
    var remR=Math.max(0,s.restDur-s.elapsed)/1000;
    var lastRes=s.results[s.ri-1]; // s.ri already incremented; -1 = just-completed rep
    var missed=lastRes==='miss';
    var rtimeCls=missed?'tr':lastRes==='ok'?'tg':'ty';
    var rbadgeCls=missed?'br':lastRes==='ok'?'bg':'by';
    var hasNextR=s.ri<reps.length;  // s.ri IS the next rep index during rest
    var nxtRep=hasNextR?reps[s.ri]:null;
    var nxtPace=hasNextR?getPace(ti,repZ(sec,nxtRep),nxtRep.dist):null;
    cb.className='cbody '+(missed?'swr':'rs');
    cb.innerHTML=dotsH+
      (s.paused
        ? '<div class="paused-tag">PAUSED</div>'
        : missed
          ? '<div class="go-banner" style="color:#e74c3c">✗ MISSED</div>'
          : '<div class="go-banner">GO AGAIN</div>')+
      '<div class="c-time '+rtimeCls+'">'+fmtS(remR)+'</div>'+
      '<div class="c-badge '+rbadgeCls+'">'+(missed?'MISSED · ':'REST ')+fmtShort(remR)+'</div>'+
      (hasNextR
        ? '<div class="c-next-lbl" style="font-size:0.6rem;margin-top:6px">Up next</div>'+
          '<div class="c-zone-wrap"><span class="c-zone-badge z-'+repZ(sec,nxtRep)+'" style="font-size:0.75rem;padding:3px 9px">Zone '+repZ(sec,nxtRep).slice(1)+'</span></div>'+
          '<div class="c-laps" style="margin-bottom:0">'+nxtRep.laps+' laps</div>'+
          '<div class="c-next-dist" style="font-size:2.2rem">'+nxtRep.dist+'m</div>'+
          '<div class="c-next-target" style="font-size:0.85rem">Target: <b style="font-size:1.2rem">'+fmtS(nxtPace[0])+' – '+fmtS(nxtPace[1])+'</b></div>'
        : '<div class="c-next" style="color:#196f3d">Last rep done</div>');
  }
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function fmtMs(ms) {
  var tot=ms/1000, m=Math.floor(tot/60), s=Math.floor(tot%60), t=Math.floor((ms%1000)/100);
  return m+':'+pad(s)+'.'+t;
}
function fmtS(s) { s=Math.round(s); return Math.floor(s/60)+':'+pad(s%60); }
function fmtShort(s) {
  s=Math.max(0,Math.round(s)); var m=Math.floor(s/60);
  return m>0?m+':'+pad(s%60):s+'s';
}

// ── Preview ─────────────────────────────────────────────────────────────────
function renderPreview() {
  var txt = document.getElementById('setInput').value.trim();
  var card = document.getElementById('previewCard');
  var body = document.getElementById('previewBody');
  if (!txt) { card.style.display='none'; return; }

  // Temporarily set USER_CSS from inputs
  var tmpCSS = [
    parseFloat(document.getElementById('css0').value)||66,
    parseFloat(document.getElementById('css1').value)||68,
    parseFloat(document.getElementById('css2').value)||71
  ];
  USER_CSS[0]=tmpCSS[0]; USER_CSS[1]=tmpCSS[1]; USER_CSS[2]=tmpCSS[2];
  POOL_LEN = parseFloat(document.getElementById('poolLen').value)||36;

  var secs;
  try { secs = parseSet(txt); } catch(e) {
    card.style.display='block';
    body.innerHTML='<div class="prev-warn">⚠ Parse error: '+e.message+'</div>';
    return;
  }

  var html = '';
  var totalReps = 0, totalDist = 0, warnings = [];

  secs.forEach(function(sec, si) {
    html += '<div class="prev-sec">';
    html += '<div class="prev-sec-title">' + sec.title + '</div>';

    if (sec.timed) {
      // Determine if section has mixed zones across reps
      var zones = {};
      sec.reps.forEach(function(r){ zones[(r.zKey||sec.zKey)] = 1; });
      var zoneList = Object.keys(zones).sort().map(function(z){ return z.slice(1); });
      // Meta info
      var meta = [];
      meta.push('<span>Zone ' + zoneList.join('/') + '</span>');
      if (sec.restBetween) meta.push('<span>:' + pad(sec.restBetween) + ' rest</span>');
      if (sec.rounds > 1) meta.push('<span>' + sec.rounds + ' rounds</span>');
      if (sec.roundBreakRest > 0) meta.push('<span>:' + pad(sec.roundBreakRest) + ' between rounds</span>');
      if (sec.equipment) meta.push('<span>' + sec.equipment + '</span>');
      if (sec.restAfterSec > 0) meta.push('<span>' + sec.restAfterLabel + ' set break</span>');
      html += '<div class="prev-sec-meta">' + meta.join(' ') + '</div>';

      // Reps
      if (sec.reps.length === 0) {
        warnings.push('Section "' + sec.title + '" is timed but has 0 reps');
        html += '<div class="prev-warn">⚠ No reps parsed!</div>';
      }
      // Pre-compute rest override detection for preview (same rule as live display)
      var _prevAnyRest = false;
      for (var _pi = 0; _pi < sec.reps.length; _pi++) {
        if (sec.reps[_pi].rest != null && sec.reps[_pi].rest !== sec.restBetween) { _prevAnyRest = true; break; }
      }
      sec.reps.forEach(function(r, ri) {
        var pace = getPace(0, repZ(sec, r), r.dist); // tier 1 for preview
        var rndTag = r.roundEnd ? '<span class="pr-rnd">round end</span>' : '';
        var effPrevZ = repZ(sec, r);
        var zTag = ' <span class="pr-zone z-'+effPrevZ+'">Zone '+effPrevZ.slice(1)+'</span>';
        var effPrevRest = (r.rest != null) ? r.rest : sec.restBetween;
        var restTag = (_prevAnyRest && effPrevRest) ? ' <span class="pr-rest">:'+pad(effPrevRest)+' rest</span>' : '';
        html += '<div class="prev-rep">' +
          '<span class="pr-idx">' + (ri+1) + '.</span>' +
          '<span class="pr-dist">' + r.dist + 'm <span class="pr-laps-inline">('+r.laps+'L)</span>' + zTag + restTag + '</span>' +
          '<span class="pr-target">' + fmtS(pace[0]) + '–' + fmtS(pace[1]) + '</span>' +
          rndTag +
        '</div>';
        totalReps++;
        totalDist += r.dist;
      });
    } else {
      // Untimed items
      if (sec.items && sec.items.length) {
        sec.items.forEach(function(it) {
          html += '<div class="prev-item">· ' + it + '</div>';
        });
      } else {
        html += '<div class="prev-item" style="color:#5a2020">(no items)</div>';
      }
    }
    html += '</div>';
  });

  // Summary
  var summary = '<div class="prev-ok">✓ ' + secs.length + ' section' + (secs.length>1?'s':'') +
    ' · ' + totalReps + ' timed reps · ' + totalDist + 'm total distance</div>';
  if (warnings.length) {
    summary = warnings.map(function(w){ return '<div class="prev-warn">⚠ '+w+'</div>'; }).join('') + summary;
  }

  card.style.display = 'block';
  body.innerHTML = html + summary;
}

// Live preview on input
var _prevTimer = null;
document.getElementById('setInput').addEventListener('input', function() {
  clearTimeout(_prevTimer);
  _prevTimer = setTimeout(renderPreview, 400);
});
// Also update on CSS/pool changes
['css0','css1','css2','poolLen'].forEach(function(id){
  document.getElementById(id).addEventListener('input', function(){
    clearTimeout(_prevTimer);
    _prevTimer = setTimeout(renderPreview, 400);
  });
});
